name: Build and Release Wails3 App

on:
  push:
    tags:
      - 'v*' # 当推送 v1.0.0 等标签时触发
  workflow_dispatch: # 允许手动触发测试

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  APP_NAME: mmclaw  # 💡 在这里统一配置你的应用名称，方便后续重用

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin
            arch: amd64
          - os: macos-latest
            platform: darwin
            arch: arm64
          - os: windows-latest
            platform: windows
            arch: amd64
          - os: ubuntu-latest
            platform: linux
            arch: amd64

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write  # 允许创建 Release 并上传文件

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. 安装系统依赖 (Linux 必须)
      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config build-essential

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # 2. 安装 Task 和 Wails3 CLI
      - name: Install Tools
        run: |
          # 安装 Task
          go install github.com/go-task/task/v3/cmd/task@latest
          # 安装 Wails3
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.91
          # 确保它们都在 PATH 中
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      # 3. 针对 Windows 准备 CGO 编译器 (使用更稳定的 MSYS2)
      - name: Install MinGW (Windows only)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      # 4. 构建步骤
      - name: Build with Task
        run: |
          if [ "${{ matrix.platform }}" = "darwin" ]; then
            task package ARCH=${{ matrix.arch }}
          elif [ "${{ matrix.platform }}" = "linux" ]; then
            # Linux 运行 package 任务来生成 AppImage/deb/rpm
            task package ARCH=${{ matrix.arch }}
          else
            CGO_ENABLED=1 task build ARCH=${{ matrix.arch }}
          fi
        shell: bash
        env:
          CGO_ENABLED: 1
          GOOS: ${{ matrix.platform }}
          GOARCH: ${{ matrix.arch }}
          CC: ${{ matrix.os == 'windows-latest' && 'gcc' || '' }}

      # 5. 准备发布产物 (已修复名称问题)
      - name: Package Artifacts
        run: |
          cd bin
          if [ "${{ matrix.platform }}" = "darwin" ]; then
            # macOS: 打包新应用 mmclaw.app
            zip -r "../${{ env.APP_NAME }}-mac-${{ matrix.arch }}.zip" "${{ env.APP_NAME }}.app"
            
          elif [ "${{ matrix.platform }}" = "windows" ]; then
            # Windows: 打包新应用 mmclaw.exe 和相关的 dll
            cd bin
            mkdir -p windows-release
            cp ${{ env.APP_NAME }}.exe windows-release/
            cp *.dll windows-release/ 2>/dev/null || true
            cd windows-release
            
            # 💡 GitHub Windows 镜像自带 7z，用它来打包成标准 zip 极其稳定
            7z a ../../${{ env.APP_NAME }}-windows-amd64.zip ./*
            
          elif [ "${{ matrix.platform }}" = "linux" ]; then
            # 1. 处理安装包 (AppImage, deb, rpm)
            for f in *.{AppImage,deb,rpm}; do
              if [ -f "$f" ]; then
                ext="${f##*.}"
                # 如果 Wails3 编译出来的包名已经是 mmclaw 开头，这里直接重命名归档
                mv "$f" "../${{ env.APP_NAME }}-linux-${{ matrix.arch }}.${ext}"
              fi
            done
            
            # 2. 提供 Linux “绿色版”二进制压缩包
            if [ -f "${{ env.APP_NAME }}" ]; then
              mkdir -p linux-release
              cp ${{ env.APP_NAME }} linux-release/
              cp *.so linux-release/ 2>/dev/null || true
              tar -czf "../${{ env.APP_NAME }}-linux-${{ matrix.arch }}.tar.gz" -C linux-release .
            fi
          fi
        shell: bash

      # 6. 发布产物 (已修复上传匹配规则)
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ env.APP_NAME }}-mac-*
            ${{ env.APP_NAME }}-windows-*
            ${{ env.APP_NAME }}-linux-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
