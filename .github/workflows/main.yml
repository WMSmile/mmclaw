name: Build and Release Wails3 App

on:
  push:
    tags:
      - 'v*' # 当推送 v1.0.0 等标签时触发
  workflow_dispatch: # 允许手动触发测试

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  APP_NAME: mmclaw  # 💡 统一配置你的应用名称

jobs:
  # =================================================================
  # Job 1: 负责编译桌面端原生/常规架构 (macOS & Windows & Linux amd64)
  # =================================================================
  build-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin
            arch: amd64
          - os: macos-latest
            platform: darwin
            arch: arm64
          - os: windows-latest
            platform: windows
            arch: amd64
          - os: windows-latest
            platform: windows
            arch: arm64
          - os: ubuntu-latest
            platform: linux
            arch: amd64

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config build-essential

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Tools
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.91
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Install MinGW (Windows AMD64)
        if: matrix.os == 'windows-latest' && matrix.arch == 'amd64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Install LLVM/Clang (Windows ARM64)
        if: matrix.os == 'windows-latest' && matrix.arch == 'arm64'
        run: |
          choco install llvm -y
          echo "C:\Program Files\LLVM\bin" >> $GITHUB_PATH
        shell: bash

      - name: Build with Task
        run: |
          if [ "${{ matrix.platform }}" = "darwin" ]; then
            task package ARCH=${{ matrix.arch }}
          elif [ "${{ matrix.platform }}" = "linux" ]; then
            task package ARCH=${{ matrix.arch }}
          else
            task build ARCH=${{ matrix.arch }}
          fi
        shell: bash
        env:
          CGO_ENABLED: 1
          GOOS: ${{ matrix.platform }}
          GOARCH: ${{ matrix.arch }}
          CC: ${{ matrix.os == 'windows-latest' && matrix.arch == 'amd64' && 'gcc' || (matrix.os == 'windows-latest' && matrix.arch == 'arm64' && 'clang --target=aarch64-w64-windows-gnu' || '') }}

      # Pemb备发布产物
      - name: Package Artifacts
        run: |
          if [ "${{ matrix.platform }}" = "darwin" ]; then
            cd bin
            zip -r "../${{ env.APP_NAME }}-mac-${{ matrix.arch }}.zip" "${{ env.APP_NAME }}.app"
          elif [ "${{ matrix.platform }}" = "windows" ]; then
            TARGET_DIR="."
            if [ -d "build/bin" ]; then TARGET_DIR="build/bin"; elif [ -d "bin" ]; then TARGET_DIR="bin"; fi
            mkdir -p ../windows-release
            cp "$TARGET_DIR/${{ env.APP_NAME }}.exe" ../windows-release/
            cp $TARGET_DIR/*.dll ../windows-release/ 2>/dev/null || true
            cd ../windows-release
            7z a "../${{ env.APP_NAME }}-windows-${{ matrix.arch }}.zip" ./*
          elif [ "${{ matrix.platform }}" = "linux" ]; then
            cd bin
            for f in *.{AppImage,deb,rpm}; do
              if [ -f "$f" ]; then
                ext="${f##*.}"
                mv "$f" "../${{ env.APP_NAME }}-linux-${{ matrix.arch }}.${ext}"
              fi
            done
            if [ -f "${{ env.APP_NAME }}" ]; then
              mkdir -p linux-release
              cp ${{ env.APP_NAME }} linux-release/
              cp *.so linux-release/ 2>/dev/null || true
              tar -czf "../${{ env.APP_NAME }}-linux-${{ matrix.arch }}.tar.gz" -C linux-release .
            fi
          fi
        shell: bash

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ env.APP_NAME }}-mac-*
            ${{ env.APP_NAME }}-windows-*
            ${{ env.APP_NAME }}-linux-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =================================================================
  # Job 2: 利用 GitHub 官方原生 ARM64 虚拟机进行高速物理编译（推荐 🌟）
  # =================================================================
  build-linux-arm64:
    # 💡 核心改变：把 ubuntu-latest 换成 ubuntu-latest-arm64
    # 这样 GitHub 会直接分给你一台真正的 ARM64 架构服务器！
    runs-on: ubuntu-latest-arm64
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 💡 既然是真正的 ARM64 机器，直接像常规环境一样通过 apt 安装依赖，绝对不会有任何头文件冲突
      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config build-essential

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Tools
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.91
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      # 💡 重点：还原成最简单的本地打包，不需要任何 Docker，不需要设置任何乱七八糟的 CC 变量！
      - name: Build Natively on ARM64
        run: |
          task package ARCH=arm64
        shell: bash

      - name: Package Artifacts
        run: |
          cd bin
          for f in *.{AppImage,deb,rpm}; do
            if [ -f "$f" ]; then
              ext="${f##*.}"
              mv "$f" "../${{ env.APP_NAME }}-linux-arm64.${ext}"
            fi
          done
          if [ -f "${{ env.APP_NAME }}" ]; then
            mkdir -p linux-release
            cp ${{ env.APP_NAME }} linux-release/
            cp *.so linux-release/ 2>/dev/null || true
            tar -czf "../${{ env.APP_NAME }}-linux-arm64.tar.gz" -C linux-release .
          fi
        shell: bash

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.APP_NAME }}-linux-arm64.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
