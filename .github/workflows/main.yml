name: Build and Release Wails3 App

on:
  push:
    tags:
      - 'v*' # 当推送 v1.0.0 等标签时触发
  workflow_dispatch: # 允许手动触发测试

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  APP_NAME: mmclaw  # 💡 统一配置你的应用名称

jobs:
  # =================================================================
  # Job 1: 负责编译桌面端原生/常规架构 (macOS & Windows & Linux amd64)
  # =================================================================
  build-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin
            arch: amd64
          - os: macos-latest
            platform: darwin
            arch: arm64
          - os: windows-latest
            platform: windows
            arch: amd64
          - os: windows-latest
            platform: windows
            arch: arm64
          - os: ubuntu-latest
            platform: linux
            arch: amd64

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config build-essential

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Tools
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.91
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Install MinGW (Windows AMD64)
        if: matrix.os == 'windows-latest' && matrix.arch == 'amd64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Install LLVM/Clang (Windows ARM64)
        if: matrix.os == 'windows-latest' && matrix.arch == 'arm64'
        run: |
          choco install llvm -y
          echo "C:\Program Files\LLVM\bin" >> $GITHUB_PATH
        shell: bash

      - name: Build with Task
        run: |
          if [ "${{ matrix.platform }}" = "darwin" ]; then
            task package ARCH=${{ matrix.arch }}
          elif [ "${{ matrix.platform }}" = "linux" ]; then
            task package ARCH=${{ matrix.arch }}
          else
            task build ARCH=${{ matrix.arch }}
          fi
        shell: bash
        env:
          CGO_ENABLED: 1
          GOOS: ${{ matrix.platform }}
          GOARCH: ${{ matrix.arch }}
          CC: ${{ matrix.os == 'windows-latest' && matrix.arch == 'amd64' && 'gcc' || (matrix.os == 'windows-latest' && matrix.arch == 'arm64' && 'clang --target=aarch64-w64-windows-gnu' || '') }}

      # Pemb备发布产物
      - name: Package Artifacts
        run: |
          if [ "${{ matrix.platform }}" = "darwin" ]; then
            cd bin
            zip -r "../${{ env.APP_NAME }}-mac-${{ matrix.arch }}.zip" "${{ env.APP_NAME }}.app"
          elif [ "${{ matrix.platform }}" = "windows" ]; then
            TARGET_DIR="."
            if [ -d "build/bin" ]; then TARGET_DIR="build/bin"; elif [ -d "bin" ]; then TARGET_DIR="bin"; fi
            mkdir -p ../windows-release
            cp "$TARGET_DIR/${{ env.APP_NAME }}.exe" ../windows-release/
            cp $TARGET_DIR/*.dll ../windows-release/ 2>/dev/null || true
            cd ../windows-release
            7z a "../${{ env.APP_NAME }}-windows-${{ matrix.arch }}.zip" ./*
          elif [ "${{ matrix.platform }}" = "linux" ]; then
            cd bin
            for f in *.{AppImage,deb,rpm}; do
              if [ -f "$f" ]; then
                ext="${f##*.}"
                mv "$f" "../${{ env.APP_NAME }}-linux-${{ matrix.arch }}.${ext}"
              fi
            done
            if [ -f "${{ env.APP_NAME }}" ]; then
              mkdir -p linux-release
              cp ${{ env.APP_NAME }} linux-release/
              cp *.so linux-release/ 2>/dev/null || true
              tar -czf "../${{ env.APP_NAME }}-linux-${{ matrix.arch }}.tar.gz" -C linux-release .
            fi
          fi
        shell: bash

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ env.APP_NAME }}-mac-*
            ${{ env.APP_NAME }}-windows-*
            ${{ env.APP_NAME }}-linux-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =================================================================
  # Job 2: 专门隔离出来给 Linux ARM64 的不污染全新环境（100% 解决 Docker 冲突）
  # =================================================================
  build-linux-arm64:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 💡 极其重要：只安装基础 Go 环境，这里绝不给系统安装任何本地 C 编译器（无 gcc 污染）
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Tools
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.91
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      # 💡 修改后的 Job 2 构建步骤
      - name: Build with Docker Cross-Compiler
        run: |
          echo "Initializing official wails-cross Docker image..."
          wails3 task setup:docker
          
          echo "Running package for linux arm64 with internal package installation..."
          # 💡 核心修正：通过传入带有前缀的参数，或在 Task 调用前，让 Wails 知道需要补齐容器内的 C 依赖
          # 如果 Wails3 允许通过 wails3 build 传参，我们直接改用 wails3 命令行显式交叉编译，它能更聪明地处理依赖：
          wails3 build -platform linux/arm64 -package
        shell: bash
        # 💡 这里完全不声明任何 GOOS, GOARCH 或 CC 全局变量！避免把宿主机环境漏给 Docker

      - name: Package Artifacts
        run: |
          cd bin
          for f in *.{AppImage,deb,rpm}; do
            if [ -f "$f" ]; then
              ext="${f##*.}"
              mv "$f" "../${{ env.APP_NAME }}-linux-arm64.${ext}"
            fi
          done
          if [ -f "${{ env.APP_NAME }}" ]; then
            mkdir -p linux-release
            cp ${{ env.APP_NAME }} linux-release/
            cp *.so linux-release/ 2>/dev/null || true
            tar -czf "../${{ env.APP_NAME }}-linux-arm64.tar.gz" -C linux-release .
          fi
        shell: bash

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.APP_NAME }}-linux-arm64.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
