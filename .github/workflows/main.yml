name: Build and Release Wails3 App

on:
  push:
    tags:
      - 'v*' # 当推送 v1.0.0 等标签时触发
  workflow_dispatch: # 允许手动触发测试

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  APP_NAME: mmclaw  # 💡 统一配置应用名称

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin
            arch: amd64
          - os: macos-latest
            platform: darwin
            arch: arm64
          - os: windows-latest
            platform: windows
            arch: amd64
          # 💡 新增：Windows ARM64 支持
          - os: windows-latest
            platform: windows
            arch: arm64
          - os: ubuntu-latest
            platform: linux
            arch: amd64
          # 💡 新增：Linux ARM64 支持
          - os: ubuntu-latest
            platform: linux
            arch: arm64

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write  # 允许创建 Release 并上传文件

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. 安装系统依赖 (Linux 必须)
      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # 💡 针对 Linux ARM64 交叉编译，补充 gcc-aarch64-linux-gnu 编译器
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config build-essential \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # 2. 安装 Task 和 Wails3 CLI
      - name: Install Tools
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.91
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      # 3. 针对 Windows 准备 CGO 编译器
      # AMD64 使用稳定的 MSYS2 环境
      - name: Install MinGW (Windows AMD64)
        if: matrix.os == 'windows-latest' && matrix.arch == 'amd64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      # ARM64 使用 LLVM/Clang 进行跨架构 CGO 编译
      - name: Install LLVM/Clang (Windows ARM64)
        if: matrix.os == 'windows-latest' && matrix.arch == 'arm64'
        run: |
          choco install llvm -y
          # 将 clang 路径写入环境变量
          echo "C:\Program Files\LLVM\bin" >> $GITHUB_PATH
        shell: bash

      # 4. 构建步骤 (Docker 降级方案：让 wails 现场准备官方镜像，避开宿主机头文件污染)
      - name: Build with Task
        run: |
          if [ "${{ matrix.platform }}" = "darwin" ]; then
            task package ARCH=${{ matrix.arch }}
          elif [ "${{ matrix.platform }}" = "linux" ]; then
            # 💡 当架构为 arm64 时，先拉取/构建 wails-cross 镜像
            if [ "${{ matrix.arch }}" = "arm64" ]; then
               echo "Initializing official wails-cross Docker image..."
               wails3 task setup:docker
            fi
            task package ARCH=${{ matrix.arch }}
          else
            task build ARCH=${{ matrix.arch }}
          fi
        shell: bash
        env:
          CGO_ENABLED: 1
          GOOS: ${{ matrix.platform }}
          GOARCH: ${{ matrix.arch }}
          # 💡 注意：因为 Linux ARM64 走 Docker 内部编译，这里必须把宿主机的交叉编译器 CC 留空，避免干扰 Docker
          CC: ${{ matrix.os == 'windows-latest' && matrix.arch == 'amd64' && 'gcc' || (matrix.os == 'windows-latest' && matrix.arch == 'arm64' && 'clang --target=aarch64-w64-windows-gnu' || '') }}
          
      # 5. 准备发布产物 (已适配 ARM64 后缀)
      - name: Package Artifacts
        run: |
          # 💡 注意：由于我们在全平台矩阵运行，首先要确保从项目根目录开始算路径
          if [ "${{ matrix.platform }}" = "darwin" ]; then
            cd bin
            zip -r "../${{ env.APP_NAME }}-mac-${{ matrix.arch }}.zip" "${{ env.APP_NAME }}.app"
            
          elif [ "${{ matrix.platform }}" = "windows" ]; then
            # 1. 探测 Wails3 实际的输出目录
            TARGET_DIR="."
            if [ -d "build/bin" ]; then
              TARGET_DIR="build/bin"
            elif [ -d "bin" ]; then
              TARGET_DIR="bin"
            fi
            echo "Found Wails build output directory: $TARGET_DIR"
            
            # 2. 创建一个绝对干净的临时目录
            mkdir -p ../windows-release
            
            # 3. 拷贝产物
            cp "$TARGET_DIR/${{ env.APP_NAME }}.exe" ../windows-release/
            cp $TARGET_DIR/*.dll ../windows-release/ 2>/dev/null || true
            
            # 4. 进入临时目录压缩，带上精准的架构后缀（amd64 或 arm64）
            cd ../windows-release
            7z a "../${{ env.APP_NAME }}-windows-${{ matrix.arch }}.zip" ./*
            
          elif [ "${{ matrix.platform }}" = "linux" ]; then
            cd bin
            # 1. 处理安装包 (AppImage, deb, rpm)
            for f in *.{AppImage,deb,rpm}; do
              if [ -f "$f" ]; then
                ext="${f##*.}"
                mv "$f" "../${{ env.APP_NAME }}-linux-${{ matrix.arch }}.${ext}"
              fi
            done
            
            # 2. 提供 Linux “绿色版”二进制压缩包
            if [ -f "${{ env.APP_NAME }}" ]; then
              mkdir -p linux-release
              cp ${{ env.APP_NAME }} linux-release/
              cp *.so linux-release/ 2>/dev/null || true
              tar -czf "../${{ env.APP_NAME }}-linux-${{ matrix.arch }}.tar.gz" -C linux-release .
            fi
          fi
        shell: bash

      # 6. 发布产物 (无需修改，自动动态识别所有包)
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ env.APP_NAME }}-mac-*
            ${{ env.APP_NAME }}-windows-*
            ${{ env.APP_NAME }}-linux-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
