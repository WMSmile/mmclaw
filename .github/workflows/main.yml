name: Build and Release Wails3 App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  APP_NAME: mmclaw

jobs:
  build:
    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    strategy:
      fail-fast: false

      matrix:
        include:
          - os: macos-latest
            platform: darwin
            arch: amd64

          - os: macos-latest
            platform: darwin
            arch: arm64

          - os: windows-latest
            platform: windows
            arch: amd64

          - os: windows-latest
            platform: windows
            arch: arm64

          - os: ubuntu-latest
            platform: linux
            arch: amd64

          - os: ubuntu-latest
            platform: linux
            arch: arm64
            docker: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Linux native deps
      - name: Install Linux Dependencies
        if: matrix.platform == 'linux' && matrix.arch == 'amd64'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config \
            build-essential

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Tools
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.91
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      # Windows AMD64
      - name: Install MinGW
        if: matrix.platform == 'windows' && matrix.arch == 'amd64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Add MinGW to PATH
        if: matrix.platform == 'windows' && matrix.arch == 'amd64'
        run: echo "C:\msys64\ucrt64\bin" >> $GITHUB_PATH

      # Windows ARM64
      - name: Install LLVM
        if: matrix.platform == 'windows' && matrix.arch == 'arm64'
        run: |
          choco install llvm -y
          echo "C:\Program Files\LLVM\bin" >> $GITHUB_PATH
        shell: bash

      # Linux ARM64 Docker Cross Compile
      - name: Setup QEMU
        if: matrix.docker == true
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        if: matrix.docker == true
        uses: docker/setup-buildx-action@v3

      - name: Setup Wails Docker
        if: matrix.docker == true
        run: |
          wails3 task setup:docker

      # Build
      - name: Build App
        shell: bash
        env:
          CGO_ENABLED: 1
          GOOS: ${{ matrix.platform }}
          GOARCH: ${{ matrix.arch }}
          CC: ${{ matrix.platform == 'windows' && matrix.arch == 'amd64' && 'gcc' || (matrix.platform == 'windows' && matrix.arch == 'arm64' && 'clang --target=aarch64-w64-windows-gnu' || '') }}
        run: |

          if [ "${{ matrix.docker }}" = "true" ]; then

            echo "Building with Docker cross compiler..."

            wails3 build \
              -platform linux/arm64 \
              -package \
              -docker

          else

            echo "Building natively..."

            if [ "${{ matrix.platform }}" = "windows" ]; then
              task build ARCH=${{ matrix.arch }}
            else
              task package ARCH=${{ matrix.arch }}
            fi

          fi

      # Package
      - name: Package Artifacts
        shell: bash
        run: |

          if [ "${{ matrix.platform }}" = "darwin" ]; then

            cd bin

            zip -r "../${{ env.APP_NAME }}-mac-${{ matrix.arch }}.zip" \
              "${{ env.APP_NAME }}.app"

          elif [ "${{ matrix.platform }}" = "windows" ]; then

            mkdir -p ./windows-source
            mkdir -p ./windows-out

            TARGET_DIR="."

            if [ -d "build/bin" ]; then
              TARGET_DIR="build/bin"
            elif [ -d "bin" ]; then
              TARGET_DIR="bin"
            fi

            cp "$TARGET_DIR/${{ env.APP_NAME }}.exe" ./windows-source/
            cp $TARGET_DIR/*.dll ./windows-source/ 2>/dev/null || true

            "/c/Program Files/7-Zip/7z.exe" a \
              "./windows-out/${{ env.APP_NAME }}-windows-${{ matrix.arch }}.zip" \
              ./windows-source/*

            mv ./windows-out/*.zip ./

          elif [ "${{ matrix.platform }}" = "linux" ]; then

            cd bin

            for f in *.{AppImage,deb,rpm}; do
              if [ -f "$f" ]; then
                ext="${f##*.}"
                mv "$f" "../${{ env.APP_NAME }}-linux-${{ matrix.arch }}.${ext}"
              fi
            done

            if [ -f "${{ env.APP_NAME }}" ]; then

              mkdir -p linux-release

              cp "${{ env.APP_NAME }}" linux-release/

              cp *.so linux-release/ 2>/dev/null || true

              tar -czf \
                "../${{ env.APP_NAME }}-linux-${{ matrix.arch }}.tar.gz" \
                -C linux-release .

            fi

          fi

      # Release
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ env.APP_NAME }}-mac-*
            ${{ env.APP_NAME }}-windows-*
            ${{ env.APP_NAME }}-linux-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
