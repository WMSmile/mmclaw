name: Build and Release Wails3 App

on:
  push:
    tags:
      - 'v*' # 当推送 v1.0.0 等标签时触发
  workflow_dispatch: # 允许手动触发测试

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  APP_NAME: mmclaw  # 统一配置你的应用名称

jobs:
  # =================================================================
  # Job 1: 负责常规架构编译 (macOS & Windows & Linux amd64)
  # =================================================================
  build-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin
            arch: amd64
          - os: macos-latest
            platform: darwin
            arch: arm64
          - os: windows-latest
            platform: windows
            arch: amd64
          - os: windows-latest
            platform: windows
            arch: arm64
          - os: ubuntu-latest
            platform: linux
            arch: amd64

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config build-essential

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Tools
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.91
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Install MinGW (Windows AMD64)
        if: matrix.os == 'windows-latest' && matrix.arch == 'amd64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Add MSYS2 to Path
        if: matrix.os == 'windows-latest' && matrix.arch == 'amd64'
        run: echo "C:\msys64\ucrt64\bin" >> $GITHUB_PATH

      - name: Install LLVM/Clang (Windows ARM64)
        if: matrix.os == 'windows-latest' && matrix.arch == 'arm64'
        run: |
          choco install llvm -y
          echo "C:\Program Files\LLVM\bin" >> $GITHUB_PATH
        shell: bash

      - name: Build with Task
        run: |
          if [ "${{ matrix.platform }}" = "darwin" ]; then
            task package ARCH=${{ matrix.arch }}
          elif [ "${{ matrix.platform }}" = "linux" ]; then
            task package ARCH=${{ matrix.arch }}
          else
            task build ARCH=${{ matrix.arch }}
          fi
        shell: bash
        env:
          CGO_ENABLED: 1
          GOOS: ${{ matrix.platform }}
          GOARCH: ${{ matrix.arch }}
          CC: ${{ matrix.os == 'windows-latest' && matrix.arch == 'amd64' && 'gcc' || (matrix.os == 'windows-latest' && matrix.arch == 'arm64' && 'clang --target=aarch64-w64-windows-gnu' || '') }}

      - name: Package Artifacts
        run: |
          if [ "${{ matrix.platform }}" = "darwin" ]; then
            cd bin
            zip -r "../${{ env.APP_NAME }}-mac-${{ matrix.arch }}.zip" "${{ env.APP_NAME }}.app"
          elif [ "${{ matrix.platform }}" = "windows" ]; then
            echo "=== 开始处理 Windows 产物 ==="
            mkdir -p ./windows-source
            mkdir -p ./windows-out
            TARGET_DIR="."
            if [ -d "build/bin" ]; then TARGET_DIR="build/bin"; elif [ -d "bin" ]; then TARGET_DIR="bin"; fi
            cp "$TARGET_DIR/${{ env.APP_NAME }}.exe" ./windows-source/
            cp $TARGET_DIR/*.dll ./windows-source/ 2>/dev/null || true
            "/c/Program Files/7-Zip/7z.exe" a "./windows-out/${{ env.APP_NAME }}-windows-${{ matrix.arch }}.zip" ./windows-source/*
            mv ./windows-out/*.zip ./
            echo "=== Windows 产物打包完毕 ==="
            ls -la *.zip
          elif [ "${{ matrix.platform }}" = "linux" ]; then
            cd bin
            for f in *.{AppImage,deb,rpm}; do
              if [ -f "$f" ]; then
                ext="${f##*.}"
                mv "$f" "../${{ env.APP_NAME }}-linux-${{ matrix.arch }}.${ext}"
              fi
            done
            if [ -f "${{ env.APP_NAME }}" ]; then
              mkdir -p linux-release
              cp ${{ env.APP_NAME }} linux-release/
              cp *.so linux-release/ 2>/dev/null || true
              tar -czf "../${{ env.APP_NAME }}-linux-${{ matrix.arch }}.tar.gz" -C linux-release .
            fi
          fi
        shell: bash

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ env.APP_NAME }}-mac-*
            ${{ env.APP_NAME }}-windows-*
            ${{ env.APP_NAME }}-linux-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =================================================================
  # Job 2: 独立使用 ubuntu-latest (x86_64) 通过 Docker 编译 Linux ARM64
  # =================================================================
  build-linux-arm64:
    runs-on: ubuntu-latest  # 💡 保持传统的纯 x86_64 机器
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 💡 极其纯净：这里【不安装】宿主机的 apt-get 依赖，防止污染 Docker 环境变量
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Tools
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.91
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Build with Docker Cross-Compiler
        run: |
          echo "Initializing official wails-cross Docker image..."
          wails3 task setup:docker
          
          echo "Running package for linux arm64 inside Docker..."
          # 💡 核心改动：直接调用 wails3 命令行显式进行 linux/arm64 构建，
          # 这样 Wails 底层会自动向 Docker 容器内下载所需的 GTK3/WebKit 交叉 C 依赖，彻底解决丢失链接库问题。
          wails3 build -platform linux/arm64 -package
        shell: bash

      - name: Package Artifacts
        run: |
          cd bin
          for f in *.{AppImage,deb,rpm}; do
            if [ -f "$f" ]; then
              ext="${f##*.}"
              mv "$f" "../${{ env.APP_NAME }}-linux-arm64.${ext}"
            fi
          done
          if [ -f "${{ env.APP_NAME }}" ]; then
            mkdir -p linux-release
            cp ${{ env.APP_NAME }} linux-release/
            cp *.so linux-release/ 2>/dev/null || true
            tar -czf "../${{ env.APP_NAME }}-linux-arm64.tar.gz" -C linux-release .
          fi
        shell: bash

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.APP_NAME }}-linux-arm64.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
